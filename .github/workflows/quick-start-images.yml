name: Build Quick-Start Images

on:
  push:
    branches: [main, develop]
    paths:
      - 'quick-starts/quick-start-*/**'
      - 'pom.xml'
      - 'src/main/**'
      - '.github/workflows/quick-start-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-jar:
    name: Build KETE JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kete-jar
          path: target/kete.jar
          retention-days: 1

  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build-jar
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: keycloak
            version-pattern: 'keycloak:\K[0-9.]+'
            context: .
          - image: lavinmq
            version-pattern: 'lavinmq:\K[0-9.]+'
          - image: rabbitmq
            version-pattern: 'rabbitmq:\K[0-9.]+'
          - image: activemq
            version-pattern: 'activemq-artemis:\K[0-9.]+'
          - image: kafka
            version-pattern: 'kafka:\K[0-9.]+'
          - image: kafka-ui
            version-pattern: 'kafka-ui:v\K[0-9.]+'
          - image: emqx
            version-pattern: 'emqx:\K[0-9.]+'
          - image: mosquitto
            version-pattern: 'mosquitto:\K[0-9.]+'
          - image: http-echo
            version-pattern: 'http-https-echo:\K[0-9]+'
          - image: curl
            version-pattern: 'curl:\K[0-9.]+'
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        if: matrix.image == 'keycloak'
        uses: actions/download-artifact@v4
        with:
          name: kete-jar
          path: target

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP '${{ matrix.version-pattern }}' quick-starts/quick-start-${{ matrix.image }}/Dockerfile)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context || format('quick-starts/quick-start-{0}', matrix.image) }}
          file: quick-starts/quick-start-${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/quick-start-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/quick-start-${{ matrix.image }}:latest
