# Azure Event Hubs Emulator with Kafka protocol support
# See: https://github.com/Azure/azure-event-hubs-emulator-installer
# Event Hubs emulator requires Azurite (Azure Storage Emulator) as a dependency

services:

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 10

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    ports:
      - 5672:5672
      - 9092:9092
      - 5300:5300
    environment:
      ACCEPT_EULA: "Y"
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    volumes:
      - ./Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    depends_on:
      azurite:
        condition: service_healthy

  # Wait for the emulator Kafka port to be ready before starting Keycloak
  wait-for-emulator:
    image: alpine:latest
    command: >
      sh -c "
        echo 'Waiting for Event Hubs emulator Kafka port to be ready...';
        while ! nc -z eventhubs-emulator 9092 2>/dev/null; do
          sleep 2;
        done;
        echo 'Event Hubs emulator Kafka port is ready!'
      "
    depends_on:
      - eventhubs-emulator

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
    environment:
      kete.routes.quick-start.destination.kind: kafka
      kete.routes.quick-start.destination.bootstrap.servers: eventhubs-emulator:9092
      kete.routes.quick-start.destination.topic: keycloak-events
      kete.routes.quick-start.destination.security.protocol: SASL_PLAINTEXT
      kete.routes.quick-start.destination.sasl.mechanism: PLAIN
      kete.routes.quick-start.destination.compression.type: none
      kete.routes.quick-start.destination.sasl.jaas.config: io.github.fortunen.kete.shaded.kafka.common.security.plain.PlainLoginModule required username="$$ConnectionString" password="Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;";
    depends_on:
      wait-for-emulator:
        condition: service_completed_successfully
