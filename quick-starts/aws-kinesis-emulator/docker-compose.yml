services:

  localstack:
    image: ghcr.io/fortunen/kete/quick-start-localstack
    ports:
      - 4566:4566
    environment:
      SERVICES: kinesis
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kinesis-setup:
    image: ghcr.io/fortunen/kete/quick-start-curl
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -sf -X POST http://localstack:4566/ \
          -H "Content-Type: application/x-amz-json-1.1" \
          -H "X-Amz-Target: Kinesis_20131202.CreateStream" \
          -d '{"StreamName":"keycloak-events","ShardCount":1}' &&
        echo "Waiting for stream to become active..." &&
        for i in $$(seq 1 30); do
          STATUS=$$(curl -sf -X POST http://localstack:4566/ \
            -H "Content-Type: application/x-amz-json-1.1" \
            -H "X-Amz-Target: Kinesis_20131202.DescribeStream" \
            -d '{"StreamName":"keycloak-events"}')
          if echo "$$STATUS" | grep -q '"ACTIVE"'; then
            echo "Stream 'keycloak-events' is active"
            break
          fi
          sleep 1
        done &&
        sleep infinity

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      kete.routes.quick-start.destination.kind: aws-kinesis
      kete.routes.quick-start.destination.stream: keycloak-events
      kete.routes.quick-start.destination.partition-key: keycloak
      kete.routes.quick-start.destination.region: us-east-1
      kete.routes.quick-start.destination.endpoint-url: http://localstack:4566
    depends_on:
      kinesis-setup:
        condition: service_started
