services:

  webhook:
    image: ghcr.io/fortunen/kete/quick-start-http-echo
    ports:
      - 8090:8090
    environment:
      HTTP_PORT: 8090
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/ || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      kete.routes.quick-start.destination.kind: http
      kete.routes.quick-start.destination.url: http://webhook:8090/keycloak-events
      kete.routes.quick-start.destination.method: POST
    depends_on:
      webhook:
        condition: service_healthy
