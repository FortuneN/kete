name: Pull Request

on:
  pull_request:
    branches: [develop, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material mkdocs-include-markdown-plugin

      - name: Run Script
        run: pwsh -File ./run-on-pull-request-push.ps1
