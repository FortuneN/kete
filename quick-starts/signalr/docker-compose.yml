services:

  signalr-echo:
    image: ghcr.io/fortunen/kete/quick-start-signalr-echo
    ports:
      - 5000:5000
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/messages || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      kete.routes.quick-start.destination.kind: signalr
      kete.routes.quick-start.destination.url: http://signalr-echo:5000/hub
      kete.routes.quick-start.destination.hub-method: SendEvent
    depends_on:
      signalr-echo:
        condition: service_healthy
