# AWS SNS (Real)
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # AWS SNS configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: aws-sns
      kete.routes.quick-start.destination.topic: ${AWS_SNS_TOPIC:-keycloak-events}
      kete.routes.quick-start.destination.region: ${AWS_REGION:-us-east-1}
      kete.routes.quick-start.destination.account-id: ${AWS_ACCOUNT_ID:-<YOUR-ACCOUNT-ID>}
      kete.routes.quick-start.destination.authentication-type: access-key
      kete.routes.quick-start.destination.access-key-id: ${AWS_ACCESS_KEY_ID:-<YOUR-ACCESS-KEY-ID>}
      kete.routes.quick-start.destination.secret-access-key: ${AWS_SECRET_ACCESS_KEY:-<YOUR-SECRET-ACCESS-KEY>}
