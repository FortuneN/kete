# Google Cloud Memorystore for Redis (Pub/Sub)
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # Google Cloud Memorystore configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: redis-pubsub
      kete.routes.quick-start.destination.host: ${MEMORYSTORE_HOST:-<YOUR-INSTANCE-IP>}
      kete.routes.quick-start.destination.port: 6379
      kete.routes.quick-start.destination.channel: keycloak-events
      kete.routes.quick-start.destination.password: ${MEMORYSTORE_AUTH_STRING:-<YOUR-AUTH-STRING>}
