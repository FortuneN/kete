# Azure Storage Queue
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # Azure Storage Queue configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: azure-storage-queue
      kete.routes.quick-start.destination.connection-string: ${AZURE_STORAGE_CONNECTION_STRING:-<YOUR-AZURE-STORAGE-CONNECTION-STRING>}
      kete.routes.quick-start.destination.queue: keycloak-events
