<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7F3FF"/>
      <stop offset="1" stop-color="#2B6BFF"/>
    </linearGradient>
    <linearGradient id="g2" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE7FF"/>
      <stop offset="1" stop-color="#1E4ED8"/>
    </linearGradient>
  </defs>

  <!-- Hexagon frame -->
  <polygon points="256,40 436,144 436,368 256,472 76,368 76,144"
           fill="none" stroke="url(#g)" stroke-width="24" stroke-linejoin="round"/>

  <!-- Stylized K / fan-out arrows (all emanate from the same joint) -->
