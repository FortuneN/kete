# Google Cloud Pub/Sub
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # Google Cloud Pub/Sub configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: gcp-pubsub
      kete.routes.quick-start.destination.project: ${GCP_PROJECT_ID:-<YOUR-PROJECT-ID>}
      kete.routes.quick-start.destination.topic: keycloak-events
      kete.routes.quick-start.destination.credentials-file-base64: ${GCP_SA_KEY_BASE64:-<YOUR-BASE64-ENCODED-SERVICE-ACCOUNT-JSON>}
