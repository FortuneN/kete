site_name: KETE
site_description: Keycloak Event Listener that forwards events to various destinations
site_url: https://fortunen.github.io/kete
repo_url: https://github.com/FortuneN/kete
repo_name: FortuneN/kete

extra_css:
  - assets/css/indent-left-menu.css
  - assets/css/donation-links.css

extra_javascript:
  - assets/js/hide-home-left-menu.js
  - assets/js/open-external-links-in-new-tabs.js
  - assets/js/donation-links-top-right.js

extra:
  social:
    - icon: fontawesome/solid/star
      link: https://github.com/FortuneN/kete
      name: Give the project a star
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/FortuneNgwenya
      name: Donate via PayPal
    - icon: fontawesome/brands/github
      link: https://github.com/sponsors/FortuneN
      name: Sponsor on GitHub
    - icon: simple/buymeacoffee
      link: https://www.buymeacoffee.com/FortuneN
      name: Buy Me a Coffee
    - icon: simple/kofi
      link: https://ko-fi.com/FortuneN
      name: Support on Ko-fi
    - icon: simple/liberapay
      link: https://liberapay.com/FortuneN
      name: Donate via Liberapay

theme:
  name: material
  logo: logo.png
  favicon: favicon.ico
  palette:
    - scheme: default
      primary: grey
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: grey
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - include-markdown

markdown_extensions:
  - meta
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

