# Azure Event Grid MQTT 5 Broker
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
    environment:
      # Azure Event Grid MQTT configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: mqtt-5
      kete.routes.quick-start.destination.host: ${EVENTGRID_MQTT_HOST:-<YOUR-NAMESPACE>.westus2-1.ts.eventgrid.azure.net}
      kete.routes.quick-start.destination.port: 8883
      kete.routes.quick-start.destination.topic: keycloak/events
      kete.routes.quick-start.destination.qos: 1
      kete.routes.quick-start.destination.tls.enabled: "true"

      # X.509 Certificate Authentication (client certificate for mTLS)
      # Generate certificates as described in GUIDE.md
      kete.routes.quick-start.destination.tls.key-store.loader.kind: pem-file-path
      kete.routes.quick-start.destination.tls.key-store.loader.path: /certs/client.pem

    volumes:
      - ./certs:/certs:ro
