# Azure Event Hubs Emulator (AMQP 1.0)
# Local development emulator - no Azure subscription required
# See: https://github.com/Azure/azure-event-hubs-emulator-installer
#
# NOTE: Event Hubs uses CBS (Claims Based Security) over AMQP, so a generic
# AMQP 1.0 subscriber cannot receive messages. We use a Kafka subscriber for
# reception verification since the emulator also exposes a Kafka endpoint.
# KETE still sends via AMQP 1.0 — only the verification uses Kafka.

services:

  azurite:
    image: ghcr.io/fortunen/kete/quick-start-azurite
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 10

  eventhubs-emulator:
    image: ghcr.io/fortunen/kete/quick-start-eventhubs-emulator
    ports:
      - 5672:5672
      - 9092:9092
      - 5300:5300
    volumes:
      - ./Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    environment:
      ACCEPT_EULA: "Y"
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    depends_on:
      azurite:
        condition: service_healthy

  # Wait for both AMQP and Kafka ports to be ready before starting Keycloak
  wait-for-emulator:
    image: ghcr.io/fortunen/kete/quick-start-alpine
    command: >
      sh -c "
        echo 'Waiting for Event Hubs emulator ports to be ready...';
        while ! nc -z eventhubs-emulator 5672 2>/dev/null; do
          sleep 2;
        done;
        echo 'Event Hubs emulator AMQP port is ready!';
        while ! nc -z eventhubs-emulator 9092 2>/dev/null; do
          sleep 2;
        done;
        echo 'Event Hubs emulator Kafka port is ready!'
      "
    depends_on:
      - eventhubs-emulator

  # Kafka subscriber to verify event reception
  # (Event Hubs emulator exposes Kafka protocol alongside AMQP)
  subscriber:
    image: ghcr.io/fortunen/kete/quick-start-kafka-subscriber
    environment:
      KAFKA_BOOTSTRAP_SERVERS: eventhubs-emulator:9092
      KAFKA_TOPIC: keycloak-events
      KAFKA_GROUP_ID: event-checker
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: $$ConnectionString
      KAFKA_SASL_PASSWORD: Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      wait-for-emulator:
        condition: service_completed_successfully

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    depends_on:
      wait-for-emulator:
        condition: service_completed_successfully
      subscriber:
        condition: service_started
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      kete.routes.quick-start.destination.kind: amqp-1
      kete.routes.quick-start.destination.host: eventhubs-emulator
      kete.routes.quick-start.destination.port: 5672
      kete.routes.quick-start.destination.username: RootManageSharedAccessKey
      kete.routes.quick-start.destination.password: SAS_KEY_VALUE
      kete.routes.quick-start.destination.destination-name: keycloak-events
