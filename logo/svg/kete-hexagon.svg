             L170 110 L140 140 L170 170 L170 154
             L170 358
             L170 342 L140 372 L170 402 L170 384
             L170 128 Z" />

    <!-- upper diagonal arm (arrow at tip) -->
    <path d="M190 256
             L356 144
             L348 136 L388 136 L372 168 L366 158
             L214 262 Z"/>

    <!-- lower diagonal arm (arrow at tip) -->
    <path d="M190 256
             L356 368
             L366 354 L372 344 L388 376 L348 376 L356 368
             L214 250 Z"/>

    <!-- small middle fan-out (short arrow) -->
    <path d="M210 256
             L332 256
             L320 244 L356 256 L320 268 Z"/>
