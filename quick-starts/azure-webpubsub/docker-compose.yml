# Azure Web PubSub
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # Azure Web PubSub configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: azure-webpubsub
      kete.routes.quick-start.destination.connection-string: ${AZURE_WEBPUBSUB_CONNECTION_STRING:-<YOUR-AZURE-WEBPUBSUB-CONNECTION-STRING>}
      kete.routes.quick-start.destination.hub: keycloak_events
