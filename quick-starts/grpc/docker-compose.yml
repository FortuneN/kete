services:

  grpc-echo:
    image: ghcr.io/fortunen/kete/quick-start-grpc-echo
    ports:
      - 50051:50051
      - 8090:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      kete.routes.quick-start.destination.kind: grpc
      kete.routes.quick-start.destination.host: grpc-echo
      kete.routes.quick-start.destination.port: 50051
      kete.routes.quick-start.destination.service: EventService
      kete.routes.quick-start.destination.method: SendEvent
      kete.routes.quick-start.destination.use-plaintext: "true"
    depends_on:
      grpc-echo:
        condition: service_healthy
