# GCP Cloud Tasks
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # GCP Cloud Tasks configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: gcp-cloud-tasks
      kete.routes.quick-start.destination.project: ${GCP_PROJECT_ID:-<YOUR-PROJECT-ID>}
      kete.routes.quick-start.destination.location: ${GCP_LOCATION:-us-central1}
      kete.routes.quick-start.destination.queue: keycloak-events
      kete.routes.quick-start.destination.target-url: ${GCP_TARGET_URL:-<YOUR-TARGET-URL>}
      kete.routes.quick-start.destination.authentication-type: service-account-file-base64
      kete.routes.quick-start.destination.credentials-file-base64: ${GCP_SA_KEY_BASE64:-<YOUR-BASE64-ENCODED-SERVICE-ACCOUNT-JSON>}
