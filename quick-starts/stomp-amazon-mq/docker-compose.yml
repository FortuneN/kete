# Amazon MQ for ActiveMQ (STOMP)
# See GUIDE.md for setup instructions

services:

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      # Amazon MQ (ActiveMQ) with STOMP configuration
      # Replace these values or use a .env file
      kete.routes.quick-start.destination.kind: stomp
      kete.routes.quick-start.destination.host: ${AMAZONMQ_HOST:-<YOUR-BROKER-ID>.mq.<YOUR-REGION>.amazonaws.com}
      kete.routes.quick-start.destination.port: 61614
      kete.routes.quick-start.destination.tls.enabled: true
      kete.routes.quick-start.destination.username: ${AMAZONMQ_USERNAME:-<YOUR-USERNAME>}
      kete.routes.quick-start.destination.password: ${AMAZONMQ_PASSWORD:-<YOUR-PASSWORD>}
      kete.routes.quick-start.destination.destination: /queue/keycloak-events
