services:

  garnet:
    image: ghcr.io/fortunen/kete/quick-start-garnet
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: ghcr.io/fortunen/kete/quick-start-keycloak
    command: start-dev
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      kete.routes.quick-start.destination.kind: redis-stream
      kete.routes.quick-start.destination.host: garnet
      kete.routes.quick-start.destination.port: 6379
      kete.routes.quick-start.destination.stream: keycloak-events
      kete.routes.quick-start.destination.max-len: 10000
    depends_on:
      garnet:
        condition: service_healthy
